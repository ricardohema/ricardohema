name: Build animated portrait banners
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_portrait.py'
      - 'assets/profile-photo.png'
      - '.github/workflows/portrait.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/generate_portrait.py
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait-banner-dark.svg assets/portrait-banner-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Generate animated portrait banners"
            git push
          fi
